description: "Valid in progress PSBT scenarios"

test_cases:
  - description: "in progress: two P2TR inputs, neither is signed"
    task: "sign"
    validation_result: "valid"
    inputs:
      - type: "p2tr"
        amount: 200000
        skip_signing: true
      - type: "p2tr"
        amount: 10000
        skip_signing: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"

  - description: "in progress: one P2TR input / one sp output with no ECDH shares when PSBT_OUT_SCRIPT field is not set"
    task: "sign"
    validation_result: "valid"
    inputs:
      - type: "p2tr"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      missing_ecdh_for_input: 0

  - description: "in progress: two inputs / one sp output, input 1 missing ECDH share when PSBT_OUT_SCRIPT field is not set"
    task: "sign"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 150000
    outputs:
      - type: "silent_payment"
        amount: 200000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      missing_ecdh_for_input: 1  # Input 1 will not have ECDH share

  - description: "in progress: one input / two sp outputs, input 0 missing ECDH share for output 0 when PSBT_OUT_SCRIPT field is not set"
    task: "sign"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 200000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "scan_key_a"
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "scan_key_b"
    scan_keys:
      - key_id: "scan_key_a"
        derivation_suffix: "recipient_a"
      - key_id: "scan_key_b"
        derivation_suffix: "recipient_b"
    control_override:
      missing_ecdh_for_scan_key: "scan_key_a"

  # Valid counterpart to the segwit version greater than 1 invalid vectors: a
  # bare OP_2 scriptPubKey is not a BIP-141 witness program, so the segwit
  # version check must not reject it. The input is ineligible for BIP-352 and
  # contributes no ECDH share; the P2WPKH input carries the share. The bare
  # OP_2 prevout is not segwit, so it is supplied via PSBT_IN_NON_WITNESS_UTXO.
  # The input needs no signature but carries no PSBT_IN_FINAL_SCRIPTSIG, so
  # the PSBT is valid but incomplete.
  - description: "in progress: two mixed input types - only eligible inputs contribute ECDH shares (bare OP_2 excluded, not a segwit v2 witness program)"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2pkh"
        amount: 150000
        script_pubkey: "52"
        eligible_override: false
        skip_signing: true
        keyless: true
    outputs:
      - type: "silent_payment"
        amount: 245000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
