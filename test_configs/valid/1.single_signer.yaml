description: "Valid single-signer ECDH share scenarios"

test_cases:
  - description: "can finalize: one P2PKH input single-signer"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2pkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"

  - description: "can finalize: two inputs single-signer using global ECDH share"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        count: 2
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true
      no_sighash_for_input: 0

  - description: "can finalize: two inputs single-signer using per-input ECDH shares"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        count: 2
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      no_sighash_for_input: 0

  - description: "can finalize: two inputs / two sp outputs with mixed global and per-input ECDH shares"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 200000
        count: 2
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "recipient_a"
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "recipient_b"
    scan_keys:
      - key_id: "recipient_a"
        derivation_suffix: "recipient_a"
      - key_id: "recipient_b"
        derivation_suffix: "recipient_b"
    control_override:
      use_global_ecdh: ["recipient_a"]

  - description: "can finalize: one input / one sp output with both global and per-input ECDH shares"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 200000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "recipient_a"
    scan_keys:
      - key_id: "recipient_a"
        derivation_suffix: "recipient_a"
    control_override:
      use_global_ecdh: ["recipient_a"]
      force_ecdh_for_input_scan_key:
        input_index: 0
        scan_key_id: "recipient_a"

  - description: "can finalize: three sp outputs (different scan keys) with multiple global ECDH shares"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 500000
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "recipient_a"
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "recipient_b"
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "recipient_c"
    scan_keys:
      - key_id: "recipient_a"
        derivation_suffix: "recipient_a"
      - key_id: "recipient_b"
        derivation_suffix: "recipient_b"
      - key_id: "recipient_c"
        derivation_suffix: "recipient_c"
    control_override:
      use_global_ecdh: ["recipient_a", "recipient_b", "recipient_c"]
