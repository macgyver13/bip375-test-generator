description: "Valid PSBT with labeled silent payments and change outputs"

test_cases:
  - description: "can finalize: one P2WPKH input / two mixed outputs - labeled sp output and BIP 32 change"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 500000
    outputs:
      - type: "silent_payment"
        amount: 100000
        scan_key_id: "default"
        label: 1  # Labeled silent payment
      - type: "regular_p2wpkh"
        amount: 390000  # Change output (after fees)
        add_bip32_derivation: true
    scan_keys:
      - key_id: "default"

  - description: "can finalize: one input / two sp outputs - output 0 has no label / output 1 uses label=0 convention for sp change"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 300000
    outputs:
      - type: "silent_payment"
        amount: 100000
        scan_key_id: "recipient"
        # No label = recipient
      - type: "silent_payment"
        amount: 190000
        scan_key_id: "change"
        label: 0  # BIP-352 change convention
    scan_keys:
      - key_id: "change"
      - key_id: "recipient"
        derivation_suffix: "recipient"

  - description: "can finalize: three sp outputs (same scan key) - output 0 uses label=1, outputs 1 and 2 uses label=2 (same spend key)"
    task: "finalize"
    validation_result: "valid"
    inputs:
      - type: "p2wpkh"
        amount: 400000
    outputs:
      - type: "silent_payment"
        amount: 100001
        scan_key_id: "recipient"
        label: 1
      - type: "silent_payment"
        amount: 190002
        scan_key_id: "recipient"
        label: 2
      - type: "silent_payment"
        amount: 100002
        scan_key_id: "recipient"
        label: 2
    scan_keys:
      - key_id: "recipient"
        derivation_suffix: "recipient"
