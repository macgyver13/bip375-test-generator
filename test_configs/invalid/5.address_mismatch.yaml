description: "Address computation validation errors"

test_cases:
  - description: "output scripts: invalid output script in PSBT_OUT_SCRIPT field for sp output"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        key_derivation_suffix: "address_mismatch"
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
        force_wrong_script: true
    scan_keys:
      - key_id: "default"

  - description: "output scripts: outputs are not sorted lexicographically by spend key with two sp outputs (same scan key/different spend keys)"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        key_derivation_suffix: "address_mismatch"
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
        spend_derivation_suffix: "low_lex_key"
        force_k_index: 1
      - type: "silent_payment"
        amount: 10000
        scan_key_id: "default"
        spend_derivation_suffix: "high_lex_key"
        force_k_index: 0
    scan_keys:
      - key_id: "default"

  - description: "output scripts: output scripts are computed with swapped k values having three sp outputs (same scan/spend keys)"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        key_derivation_suffix: "address_mismatch"
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
        force_k_index: 0
      - type: "silent_payment"
        amount: 10000
        scan_key_id: "default"
        force_k_index: 2
      - type: "silent_payment"
        amount: 10000
        scan_key_id: "default"
        force_k_index: 1
    scan_keys:
      - key_id: "default"
