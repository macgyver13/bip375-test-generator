description: "ECDH coverage validation errors"

test_cases:
  - description: "ecdh coverage: only one ineligible P2SH multisig input when PSBT_OUT_SCRIPT set for sp output"
    violates: [bip352_outputs]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2sh_multisig"
        amount: 100000
        multisig_threshold: 2
        multisig_pubkey_count: 2
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
        force_wrong_script: true
    scan_keys:
      - key_id: "default"

  - description: "ecdh coverage: missing PSBT_IN_SP_ECDH_SHARE field for input 0 when PSBT_OUT_SCRIPT set for sp output"
    violates: [bip352_outputs]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 10000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      missing_ecdh_for_input: 0
      force_output_script: true

  - description: "ecdh coverage: missing PSBT_IN_SP_DLEQ field for input when PSBT_IN_SP_ECDH_SHARE set"
    violates: [bip374_dleq]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      missing_dleq_for_input: 0

  - description: "ecdh coverage: invalid proof in PSBT_IN_SP_DLEQ field"
    violates: [bip374_dleq]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      invalid_dleq_for_input: 0

  # Input 0's PSBT_IN_SP_DLEQ is proven with the wrong key, and input 1 has no
  # share yet, so no PSBT_OUT_SCRIPT is set. A Signer about to complete coverage
  # computes the output scripts from input 0's share, so it must verify the proof
  # now, not only once an output script is set.
  - description: "ecdh coverage: invalid proof in PSBT_IN_SP_DLEQ field when PSBT_OUT_SCRIPT not set"
    violates: [bip374_dleq]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 10000
    outputs:
      - type: "silent_payment"
        amount: 105000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      invalid_dleq_for_input: 0
      missing_ecdh_for_input: 1

  - description: "ecdh coverage: missing PSBT_GLOBAL_SP_DLEQ field when PSBT_GLOBAL_SP_ECDH_SHARE set"
    violates: [bip374_dleq]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true
      missing_global_dleq: true

  - description: "ecdh coverage: invalid proof in PSBT_GLOBAL_SP_DLEQ field"
    violates: [bip374_dleq]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true
      invalid_global_dleq: true

  # The global share and its DLEQ proof cover input 0's key only, and input 1's
  # PSBT_IN_BIP32_DERIVATION is omitted, so its pubkey cannot be recovered. The
  # proof verifies against input 0's pubkey alone; BIP-375 verifies it against
  # the sum of every eligible input's pubkey, which needs input 1's.
  - description: "ecdh coverage: global ECDH share proven over a subset of eligible inputs"
    violates: [bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 10000
    outputs:
      - type: "silent_payment"
        amount: 105000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true
      missing_ecdh_for_input: 1
      strip_input_pubkeys_for_input: 1

  - description: "ecdh coverage: missing PSBT_IN_BIP32_DERIVATION field for input when PSBT_IN_SP_DLEQ set"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
        skip_signing: true
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      strip_input_pubkeys_for_input: 0
