description: "PSBT structure validation errors"

test_cases:
  - description: "psbt structure: missing PSBT_OUT_SP_V0_INFO field when PSBT_OUT_SP_V0_LABEL set"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
        label: 1 # label but force missing SP_V0_INFO
    scan_keys:
      - key_id: "default"
    control_override:
      missing_sp_info_field: true

  - description: "psbt structure: incorrect byte length for PSBT_OUT_SP_V0_INFO field"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sp_info_size: true

  - description: "psbt structure: incorrect byte length for PSBT_IN_SP_ECDH_SHARE field"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_ecdh_share_size: true

  - description: "psbt structure: incorrect byte length for PSBT_IN_SP_DLEQ field"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_dleq_proof_size: true

  # TODO: revisit as a workflow case rather than invalid by structure. BIP-375
  # only obliges a Signer to clear the Inputs/Outputs Modifiable flags when it
  # sets a missing PSBT_OUT_SCRIPT. It never declares such a PSBT invalid, and
  # the PSBT does not record who set PSBT_OUT_SCRIPT, so the violation is not
  # observable here. Either assert the Signer obligation as a workflow step or
  # drop the case and raise the receiver-side check against the BIP.
  - description: "psbt structure: PSBT_GLOBAL_TX_MODIFIABLE field is non-zero when PSBT_OUT_SCRIPT set for sp output"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      set_tx_modifiable: true

  - description: "psbt structure: missing PSBT_OUT_SCRIPT field when sending to non-sp output"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "regular_p2wpkh"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      skip_regular_output_script: true
