description: "PSBT structure validation errors"

test_cases:
  - description: "psbt structure: missing PSBT_OUT_SP_V0_INFO field when PSBT_OUT_SP_V0_LABEL set"
    violates: [bip375_eligibility]
    task: "fail_deserialize"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
        label: 1 # label but force missing SP_V0_INFO
    scan_keys:
      - key_id: "default"
    control_override:
      missing_sp_info_field: true

  - description: "psbt structure: incorrect byte length for PSBT_OUT_SP_V0_LABEL field"
    violates: [bip174_framing]
    task: "fail_deserialize"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 500000
    outputs:
      - type: "silent_payment"
        amount: 100000
        scan_key_id: "default"
        label: 1
      - type: "regular_p2wpkh"
        amount: 390000
        add_bip32_derivation: true
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sp_label_size: true

  - description: "psbt structure: incorrect byte length for PSBT_OUT_SP_V0_INFO field"
    violates: [bip174_framing, bip352_outputs]
    task: "fail_deserialize"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sp_info_size: true

  - description: "psbt structure: incorrect byte length for PSBT_IN_SP_ECDH_SHARE field"
    violates: [bip174_framing, bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_deserialize"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_ecdh_share_size: true

  - description: "psbt structure: incorrect byte length for PSBT_IN_SP_DLEQ field"
    violates: [bip174_framing, bip374_dleq]
    task: "fail_deserialize"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_dleq_proof_size: true

  - description: "psbt structure: missing PSBT_OUT_SCRIPT field when sending to non-sp output"
    violates: [bip370_outputs]
    task: "fail_deserialize"
    validation_result: "invalid"
    exclude_material: ["inputs", "sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
        # Without the output script the transaction to sign is undefined.
        skip_signing: true
    outputs:
      - type: "regular_p2wpkh"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      skip_regular_output_script: true

  # BIP-375's field tables allow its fields only in a version 2 PSBT. This is a
  # complete, unsigned one-input silent payment PSBT re-encoded as version 0.
  - description: "psbt structure: PSBT_OUT_SP_V0_INFO and PSBT_IN_SP_ECDH_SHARE in a version 0 PSBT"
    violates: [bip174_framing]
    task: "fail_deserialize"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        skip_signing: true
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      as_psbt_v0: true
