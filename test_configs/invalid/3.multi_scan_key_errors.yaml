description: "Multi-scan-key validation errors"

test_cases:
  - description: "ecdh coverage: output 1 missing ECDH share for scan key with one input / three sp outputs (different scan keys)"
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 200000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "scan_key_a"
      - type: "silent_payment"
        amount: 10000
        scan_key_id: "scan_key_b"
      - type: "silent_payment"
        amount: 20000
        scan_key_id: "scan_key_c"
    scan_keys:
      - key_id: "scan_key_a"
        derivation_suffix: "recipient_a"
      - key_id: "scan_key_b"
        derivation_suffix: "recipient_b"
      - key_id: "scan_key_c"
        derivation_suffix: "recipient_c"
    control_override:
      missing_ecdh_for_scan_key: "scan_key_b"
      force_output_script: true

  - description: "ecdh coverage: input 1 missing ECDH share for output 1 with two inputs / two sp outputs (different scan keys)"
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "scan_key_a"
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "scan_key_b"
    scan_keys:
      - key_id: "scan_key_a"
        derivation_suffix: "recipient_a"
      - key_id: "scan_key_b"
        derivation_suffix: "recipient_b"
    control_override:
      missing_ecdh_for_input_scan_key:
        input_index: 1
        scan_key_id: "scan_key_b"
      force_partial_ecdh_output_script: true

  - description: "ecdh coverage: input 1 missing ECDH share for scan key with two inputs / one sp output"
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 50000
      - type: "p2wpkh"
        amount: 50000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      missing_ecdh_for_input: 1
      force_output_script: true
