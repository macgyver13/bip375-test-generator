description: "Address computation validation errors"

test_cases:
  - description: "output scripts: P2TR input with NUMS internal key cannot derive sp output"
    violates: [bip352_outputs]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2tr"
        amount: 10000
        use_nums_tap_internal_key: true
        eligible_override: true
        # No private key exists for a NUMS output key, so no key-path signature.
        skip_signing: true
    outputs:
      - type: "silent_payment"
        amount: 9500
        scan_key_id: "default"

  - description: "output scripts: PSBT_OUT_SCRIPT does not match derived sp output"
    violates: [bip352_outputs]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
        force_wrong_script: true
    scan_keys:
      - key_id: "default"

  - description: "output scripts: two sp outputs (same scan / different spend keys) not sorted lexicographically by spend key"
    violates: [bip352_outputs]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
        spend_derivation_suffix: "first"
      - type: "silent_payment"
        amount: 10000
        scan_key_id: "default"
        spend_derivation_suffix: "second"
    scan_keys:
      - key_id: "default"
    control_override:
      reverse_k_order: true

  - description: "output scripts: k values assigned to wrong output indices with three sp outputs (same scan / spend keys)"
    violates: [bip352_outputs]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 75000
        scan_key_id: "default"
      - type: "silent_payment"
        amount: 10000
        scan_key_id: "default"
        force_k_index: 2
      - type: "silent_payment"
        amount: 10000
        scan_key_id: "default"
        force_k_index: 1
    scan_keys:
      - key_id: "default"

  # Input 1's key is the negation of input 0's. Each input carries its share and a
  # valid DLEQ proof, but BIP-352 has the sender fail when the keys sum to zero,
  # so no output script exists for the one set here.
  - description: "output scripts: PSBT_OUT_SCRIPT set for sp output when the eligible input keys sum to the point at infinity"
    violates: [bip352_outputs]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 10000
        negate_key_of: 0
    outputs:
      - type: "silent_payment"
        amount: 105000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      force_output_script: true
