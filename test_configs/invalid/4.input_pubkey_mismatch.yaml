description: "Input public key does not match the prevout script"

# The decoy sits on an input we do not own. A foreign co-signer contributes input 1's
# PSBT_IN_BIP32_DERIVATION pubkey, ECDH share and DLEQ proof, and that pubkey is not the one
# committed to by the prevout scriptPubKey. The DLEQ proof is structurally valid for the decoy,
# so a verifier that trusts the claimed derivation pubkey has nothing to catch it with: it
# accepts, signs its own input, and the receiver - scanning with the real on-chain key - can
# never detect the output. A correct implementation must bind the derivation pubkey to the
# prevout script before using it.
#
# The input has to be foreign for this to test coverage at all. On its own input a signer
# derives the key from its own seed and sees the mismatch for free, which is ordinary BIP32
# validation rather than anything BIP-375 specific.

test_cases:
  - description: "ecdh coverage: P2WPKH PSBT_IN_BIP32_DERIVATION pubkey does not match scriptPubKey"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      force_output_script: true

  - description: "ecdh coverage: P2PKH PSBT_IN_BIP32_DERIVATION pubkey does not match scriptPubKey"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2pkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      force_output_script: true

  - description: "ecdh coverage: P2SH-P2WPKH PSBT_IN_BIP32_DERIVATION pubkey does not match scriptPubKey"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2sh_p2wpkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      force_output_script: true

  - description: "ecdh coverage: global ECDH share computed from a PSBT_IN_BIP32_DERIVATION pubkey not matching scriptPubKey"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true
      force_output_script: true

  # The P2TR input's PSBT_IN_TAP_INTERNAL_KEY claims NUMS H, but H tweaked by the
  # declared PSBT_IN_TAP_MERKLE_ROOT does not reproduce its scriptPubKey. The input
  # is key-path spendable and eligible, so it is missing its ECDH share. A verifier
  # that trusts the claim treats it as ineligible and finds the shares, DLEQ proofs
  # and output script all consistent.
  - description: "ecdh coverage: P2TR input 1 with a NUMS PSBT_IN_TAP_INTERNAL_KEY that does not tweak to scriptPubKey and no ECDH share"
    violates: [bip352_outputs, bip371_taproot, bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2tr"
        amount: 100000
        false_nums_claim: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"

  # Input 1 spends a P2SH-P2WPKH prevout, but its PSBT_IN_REDEEM_SCRIPT is a
  # 1-of-1 multisig that does not hash to the prevout. A Signer that reads
  # eligibility from the redeem script alone takes input 1 as ineligible, and the
  # share and output script are computed without its key. The receiver sums
  # input 1's key and does not find the payment.
  - description: "ecdh coverage: P2SH-P2WPKH input 1 with a non-P2WPKH PSBT_IN_REDEEM_SCRIPT that does not hash to scriptPubKey and no ECDH share"
    violates: [bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        skip_signing: true
      - type: "p2sh_p2wpkh"
        amount: 10000
        mismatch_redeem_script: true
        skip_signing: true
    outputs:
      - type: "silent_payment"
        amount: 105000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"

  - description: "ecdh coverage: finalized NUMS script-path witness not committed to prevout, input missing ECDH share"
    experimental: "finalized PSBT validation and the fail_extract task"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh, bip375_eligibility]
    task: "fail_extract"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2tr"
        amount: 80000
        false_nums_leaf: true
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true

  # The finalized form of the vector above. Input 1 is signed for its real
  # P2SH-P2WPKH prevout, then its final scriptSig redeem push is replaced with a
  # 1-of-1 multisig that does not hash to the prevout. The share and output script
  # leave input 1 out, as an Extractor would that reads eligibility from the final
  # scriptSig alone.
  - description: "ecdh coverage: finalized P2SH-P2WPKH input with non-P2WPKH final scriptSig redeem script and no ECDH share"
    experimental: "finalized PSBT validation and the fail_extract task"
    violates: [bip375_eligibility]
    task: "fail_extract"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2sh_p2wpkh"
        amount: 10000
        eligible_override: false
    outputs:
      - type: "silent_payment"
        amount: 105000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      corrupt_final_redeem: true
