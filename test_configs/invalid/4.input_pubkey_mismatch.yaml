description: "Input public key does not match the prevout script"

# The decoy sits on an input we do not own. A foreign co-signer contributes input 1's
# PSBT_IN_BIP32_DERIVATION pubkey, ECDH share and DLEQ proof, and that pubkey is not the one
# committed to by the prevout scriptPubKey. The DLEQ proof is structurally valid for the decoy,
# so a verifier that trusts the claimed derivation pubkey has nothing to catch it with: it
# accepts, signs its own input, and the receiver - scanning with the real on-chain key - can
# never detect the output. A correct implementation must bind the derivation pubkey to the
# prevout script before using it.
#
# The input has to be foreign for this to test coverage at all. On its own input a signer
# derives the key from its own seed and sees the mismatch for free, which is ordinary BIP32
# validation rather than anything BIP-375 specific.

test_cases:
  - description: "ecdh coverage: P2WPKH BIP32_DERIVATION pubkey does not match prevout script"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      force_output_script: true

  - description: "ecdh coverage: P2PKH BIP32_DERIVATION pubkey does not match prevout script"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2pkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      force_output_script: true

  - description: "ecdh coverage: P2SH-P2WPKH BIP32_DERIVATION pubkey does not match prevout script"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2sh_p2wpkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      force_output_script: true

  - description: "ecdh coverage: global ECDH share computed from decoy pubkey not matching prevout script"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2wpkh"
        amount: 100000
        owner: "foreign"
        contribute_foreign_share: true
        mismatch_sp_pubkey: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true
      force_output_script: true

  # The P2TR input's PSBT_IN_TAP_INTERNAL_KEY claims NUMS H, but H tweaked by the
  # declared PSBT_IN_TAP_MERKLE_ROOT does not reproduce its scriptPubKey. The input
  # is key-path spendable and eligible, so it is missing its ECDH share. A verifier
  # that trusts the claim treats it as ineligible and finds the shares, DLEQ proofs
  # and output script all consistent.
  - description: "ecdh coverage: P2TR input with NUMS internal key claim not matching prevout missing ECDH share"
    violates: [bip352_outputs, bip371_taproot, bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2tr"
        amount: 100000
        false_nums_claim: true
    outputs:
      - type: "silent_payment"
        amount: 195000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"

  - description: "ecdh coverage: NUMS claim from tapleaf not committed to prevout, input missing ECDH share"
    experimental: "NUMS claims from PSBT_IN_TAP_LEAF_SCRIPT"
    violates: [bip352_outputs, bip371_taproot, bip374_dleq, bip375_ecdh, bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2tr"
        amount: 80000
        false_nums_leaf: true
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true

  - description: "ecdh coverage: P2SH redeem script not matching prevout script with sp output"
    experimental: "P2SH redeem script must hash to the prevout"
    violates: [bip352_outputs, bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2sh_p2wpkh"
        amount: 100000
        mismatch_redeem_script: true
        skip_signing: true
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"

  - description: "ecdh coverage: finalized NUMS script-path witness not committed to prevout, input missing ECDH share"
    experimental: "finalized PSBT validation and the fail_extract task"
    violates: [bip352_outputs, bip374_dleq, bip375_ecdh, bip375_eligibility]
    task: "fail_extract"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2tr"
        amount: 80000
        false_nums_leaf: true
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_global_ecdh: true

  - description: "ecdh coverage: finalized P2SH input with final scriptSig redeem script not matching prevout"
    experimental: "finalized PSBT validation and the fail_extract task"
    violates: [bip352_outputs, bip375_eligibility, signatures]
    task: "fail_extract"
    validation_result: "invalid"
    inputs:
      - type: "p2sh_p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      corrupt_final_redeem: true
