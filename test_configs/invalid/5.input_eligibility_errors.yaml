description: "Signer constraint validation errors"

test_cases:
  - description: "input eligibility: segwit version greater than 1 in transaction inputs with sp output"
    violates: [bip352_outputs, bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_segwit_v2_input: True

  # Invalid counterpart to the bare OP_2 valid vector: the same inputs, but
  # input 1 spends a real segwit v2 witness program, supplied only via
  # PSBT_IN_NON_WITNESS_UTXO. Everything else is valid, so the PSBT fails only
  # because the segwit version check reads the script from either UTXO field.
  - description: "input eligibility: segwit version greater than 1 supplied via PSBT_IN_NON_WITNESS_UTXO with sp output"
    violates: [bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2pkh"
        amount: 150000
        script_pubkey: "5214229a72d34a645bd3496bbbf50bbb81c9063f4f94"
        eligible_override: false
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"

  - description: "input eligibility: non-SIGHASH_ALL signature on input with sp output"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 0

  # The partial signature's sighash byte is SIGHASH_NONE and PSBT_IN_SIGHASH_TYPE
  # is omitted, so only the signature itself carries the type.
  - description: "input eligibility: non-SIGHASH_ALL signature on input with sp output and PSBT_IN_SIGHASH_TYPE omitted"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 0
      no_sighash_for_input: 0

  # The BIP-375 sighash rule covers every input once sp outputs are present,
  # not only the inputs that contribute ECDH shares.
  - description: "input eligibility: non-SIGHASH_ALL signature on ineligible input with sp output"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2sh_multisig"
        amount: 150000
        multisig_threshold: 2
        multisig_pubkey_count: 2
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 1

  - description: "input eligibility: non-SIGHASH_ALL signature on ineligible input with sp output and PSBT_IN_SIGHASH_TYPE omitted"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
      - type: "p2sh_multisig"
        amount: 150000
        multisig_threshold: 2
        multisig_pubkey_count: 2
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 1
      no_sighash_for_input: 1

  - description: "input eligibility: non-SIGHASH_ALL signature on taproot input with sp output"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2tr"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 0

  - description: "input eligibility: non-SIGHASH_ALL signature on taproot input with sp output and PSBT_IN_SIGHASH_TYPE omitted"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2tr"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 0
      no_sighash_for_input: 0

  # A check that masks the sighash type with 0x1f reads 0x81 as SIGHASH_ALL.
  - description: "input eligibility: SIGHASH_ALL|ANYONECANPAY sighash type on input with sp output"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 0
      wrong_sighash_value: 0x81

  # SIGHASH_DEFAULT is defined only for taproot inputs.
  - description: "input eligibility: SIGHASH_DEFAULT sighash type on non-taproot input with sp output"
    violates: [bip375_sighash_all]
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 0
      wrong_sighash_value: 0x00

  - description: "input eligibility: PSBT_GLOBAL_TX_MODIFIABLE Inputs/Outputs Modifiable flags not cleared when PSBT_OUT_SCRIPT set for sp output"
    violates: [bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
        skip_signing: true
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      set_tx_modifiable: true


  - description: "input eligibility: input signed before every sp output has PSBT_OUT_SCRIPT"
    violates: [bip375_eligibility]
    task: "fail_sign"
    validation_result: "invalid"
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 90000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      missing_ecdh_for_input: 0
      sign_before_scripts: true
