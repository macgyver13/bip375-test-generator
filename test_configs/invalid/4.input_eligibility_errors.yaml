description: "Signer constraint validation errors"

test_cases:
  - description: "input eligibility: segwit version greater than 1 in transaction inputs with sp output"
    task: "fail_sign"
    validation_result: "invalid"
    checks: ["input_eligibility"]
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      use_segwit_v2_input: True

  - description: "input eligibility: non-SIGHASH_ALL signature on input with sp output"
    task: "fail_sign"
    validation_result: "invalid"
    exclude_material: ["sp_proofs", "outputs"]
    inputs:
      - type: "p2wpkh"
        amount: 100000
    outputs:
      - type: "silent_payment"
        amount: 95000
        scan_key_id: "default"
    scan_keys:
      - key_id: "default"
    control_override:
      wrong_sighash_for_input: 0
